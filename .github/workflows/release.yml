# Builds the Windows installer and publishes it as a GitHub release whenever main has a version
# number (package.json "version") that hasn't been released yet, or a version tag is pushed.
# Every installed copy of Stemlab checks these releases for updates.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Is this version already released?
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then v="${GITHUB_REF_NAME#v}"; else v=$(node -p "require('./package.json').version"); fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "v$v is already released; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Set the app version
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${{ steps.check.outputs.version }}"

      - run: npm ci
        if: steps.check.outputs.skip != 'true'

      - name: Bundle a standalone Windows Python
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          curl -sSL -o py.tar.gz "https://github.com/astral-sh/python-build-standalone/releases/download/20250317/cpython-3.11.11%2B20250317-x86_64-pc-windows-msvc-install_only.tar.gz"
          mkdir -p build && tar -xzf py.tar.gz -C build
          cd build/python
          find . -name "*.pdb" -delete
          rm -rf Lib/test Lib/idlelib Lib/tkinter tcl Lib/turtledemo

      - name: Build and publish
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:win
